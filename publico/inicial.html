<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem Vindo ao SMP</title>
    <link rel="stylesheet" href="css/estilo.css"></a>
</head>
<body>
    <div class="conteiner">
        <div class="linha">
            <h1 class="titulo1"> <strong>Aplicação de DOAÇÃO </strong></h1>

            <form class="formulario" action="/pagto" method="post">
                <p class="codigo">
                    <label for="codigo">Código do Benfeitor:</label> <br> <br>
                    <input type="numeric" 
                           inputmode="numeric"
                           maxlength="6"
                           minlength="6"
                           placeholder="123456"
                           pattern="[0-9]{1,6}"
                           id="codigo"
                           name="codigo"
                           title="Digite um código de 6 dígitos"
                           class="op1"
                           required
                           
                    >
                </p>

                <p class="valor">
                    <label for="valor">Valor a ser Doado:</label> <br> <br>
                    <input type="numeric"
                           inputmode="decimal"
                           placeholder="100.00"
                           id="valor"
                           name="valor"
                           title="Digite um valor a ser doado"
                           class="op2"
                           required
                    >
                </p>
            <div class="opcoes">
            <p class="texto4"> <strong>Selecione um método de Doação abaixo:</strong></p>

                <label>
                    <input type="radio" name="meio" value="pix" checked>
                    PIX 
                    <img src="img/pix.jpeg" alt="PIX" width="30" height="20">
                </label> </br>
                <label>
                    <input type="radio" name="meio" value="debito">
                    Débito 
                </label> </br>
                <label>
                    <input type="radio" name="meio" value="credito">
                    Cartão de Crédito 
                </label> </br> 
                <label class="texto5"> (Cartão de Crédito Possui 5% de MDR, Débito Possui 1% de MDR </br> e PIX não possui taxas)</label> </br> 
                <button type="submit" class="botao">Enviar Doação</button>
            </form>
            </div>
        </div>
    </div>
    <p class="copyright"> &copy; 2026 Simulador de Meio de Pagamento. Todos os direitos reservados.</p>

</body>
</html>

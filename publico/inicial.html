<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem Vindo ao SMP</title>
    <link rel="stylesheet" href="css/estilo.css"></a>
</head>
<body>
    <div class="conteiner">
            <div class="linha">
            <h1 class="titulo1"> <strong>Aplicação de DOAÇÃO </strong></h1>
            <p class="codigo">
                <label for="codigo">Código do Benfeitor:</label> <br> <br>
                <input type="text" 
                       inputmode="numeric"
                       maxlength="6"
                       placeholder="123456"
                       pattern="[0-9]{1,6}"
                       id="codigo"
                       name="codigo_doador"
                       title="Digite um código de 6 dígitos"
                >
            </p>
            <p class="valor">
                <label for="valor">Valor a ser Doado:</label> <br> <br>
                <input type="text" 
                       inputmode="decimal"
                       placeholder="123456"
                       pattern="[0-9]{1,6}"
                       id="valor"
                       name="valor_doador"
                       title="Digite um código de 6 dígitos"
                >
            <form class="formulario" action="Cprogram/confirmacao.c" method="post">
                <p> Selecione um método de Doação abaixo:</p>

                <label>
                    <input type="radio" name="metodo" value="Botão1" checked>
                    PIX
                </label> </br>
                <label>
                    <input type="radio" name="metodo" value="Botão1" checked>
                    Débito
                </label> </br>
                <label>
                    <input type="radio" name="metodo" value="Botão1" checked>
                    Cartão de Crédito
                </label> </br> <br>
                <button type="submit">Enviar Doação</button>
            </form>            
        </div>

    </div>

</body>
</html>
